[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vakhter"
version = "0.1.0"
description = "Autonomous structural security guard for LLM inputs — homoglyphs, invisibles, encoding carriers, look-alike domains, injection / RCE / data:-URI structure. Zero dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Proprietary — all rights reserved. See LICENSE." }
authors = [{ name = "Ruslan Malyavskiy" }]
keywords = ["security", "llm", "prompt-injection", "homoglyph", "unicode", "guard"]
dependencies = []

[project.urls]
Repository = "https://github.com/Rus1978Rus/Vakhter"

[project.scripts]
vakhter = "vakhter.__main__:main"

[tool.setuptools]
# The `vakhter` shim plus the three runtime directories, mounted as subpackages
# WITHOUT moving them in the repo (package-dir maps a package name to an existing
# path). This makes a plain `pip install .` copy the guard's runtime into the
# wheel — `from vakhter import analyze` then works with no source tree present.
# The modules are still imported FLAT: vakhter/__init__.py puts these dirs on
# sys.path in both the installed and the source layout.
packages = [
    "vakhter",
    "vakhter.range",
    "vakhter.canonicalization",
    "vakhter.invariant_engine",
]

[tool.setuptools.package-dir]
"vakhter.range" = "code/range"
"vakhter.canonicalization" = "code/canonicalization"
"vakhter.invariant_engine" = "code/invariant_engine/invariant_engine"
